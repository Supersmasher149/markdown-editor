[package]
name = "markdown-editor"
version = "0.1.0"
description = "A local-first Markdown editor for macOS"
authors = ["Walter Gibbons"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# would otherwise collide on Windows (rust-lang/cargo#8519).
name = "markdown_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
